name: Deploy Pipeline

on:
  push:
    branches: [ "main" ]

# Définition des variables d'environnement
env:
  PROJECT_ID: project-e8660359-eb66-4c3c-8c3
  IMAGE_URL: europe-west1-docker.pkg.dev/project-e8660359-eb66-4c3c-8c3/sephora/pipeline

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    # Permissions CRITIQUES pour remplacer GCP_SA_KEY
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Test et Build Maven
        run: mvn clean verify

      # --- ÉTAPE MISE À JOUR : Authentification via WIF (Sans clé JSON) ---
      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/737636855543/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'runner-dataflow@project-e8660359-eb66-4c3c-8c3.iam.gserviceaccount.com'

      - name: Configuration de Docker pour Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
      # --------------------------------------------------------------

      - name: Build de l'image Docker
        run: docker build -t ${{ env.IMAGE_URL }} .

      - name: Push vers Artifact Registry
        run: docker push ${{ env.IMAGE_URL }}

      # Optionnel : Lancement automatique du job Dataflow après le push
      - name: Deploy to Dataflow
        run: |
          mvn exec:java \
            -Dexec.mainClass="com.sephora.data.pipeline.ProductIngestionPipeline" \
            -Dexec.args="--runner=DataflowRunner \
                          --project=${{ env.PROJECT_ID }} \
                          --region=europe-west1 \
                          --tempLocation=gs://sephora-raw-data-${{ env.PROJECT_ID }}-dev/temp \
                          --stagingLocation=gs://sephora-raw-data-${{ env.PROJECT_ID }}-dev/staging \
                          --serviceAccount=runner-dataflow@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"